<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Threads authorization — Philip Mulyana</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f2ea; color: #171717; }
    main { width: min(560px, calc(100% - 40px)); background: white; border: 1px solid #dedbd2; border-radius: 20px; padding: 32px; box-sizing: border-box; box-shadow: 0 16px 48px rgba(0,0,0,.08); }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.15; }
    p { line-height: 1.55; }
    .muted { color: #606060; }
    .error { color: #a51d1d; }
    button { border: 0; border-radius: 999px; background: #111; color: #fff; font: inherit; font-weight: 700; padding: 12px 18px; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    code { display: block; overflow-wrap: anywhere; padding: 12px; border-radius: 10px; background: #f0eee8; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Memeriksa otorisasi Threads…</h1>
    <p id="message" class="muted">Tunggu sebentar.</p>
    <code id="code" hidden></code>
    <button id="copy" type="button" hidden>Salin authorization code</button>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const error = params.get('error');
      const description = params.get('error_description');
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const codeBox = document.getElementById('code');
      const copy = document.getElementById('copy');

      if (code) {
        sessionStorage.setItem('threads_oauth_code', code);
        history.replaceState({}, document.title, location.pathname);
        title.textContent = 'Otorisasi Threads diterima';
        message.textContent = 'Code hanya tersimpan di tab browser ini. Jangan kirim melalui chat.';
        codeBox.textContent = code;
        codeBox.hidden = false;
        copy.hidden = false;
        copy.addEventListener('click', async () => {
          await navigator.clipboard.writeText(code);
          copy.textContent = 'Tersalin';
        });
        return;
      }

      if (error) {
        history.replaceState({}, document.title, location.pathname);
        title.textContent = 'Otorisasi dibatalkan';
        message.textContent = description || error;
        message.className = 'error';
        return;
      }

      title.textContent = 'Callback Threads siap';
      message.textContent = 'Gunakan URL halaman ini sebagai Valid OAuth Redirect URI di Meta App Dashboard.';
    })();
  </script>
</body>
</html>
