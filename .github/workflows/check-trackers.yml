name: Tracker guard (Meta Pixel on every page)

# Enforces Philip's rule: every published page must carry js/pixel.js.
# Fails the build if any real (non-redirect-stub) page is missing it.

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/scripts/check_trackers.py'
      - '.github/scripts/publish_blogs.py'
  pull_request:
    paths:
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every page carries the tracker
        run: python3 .github/scripts/check_trackers.py .
