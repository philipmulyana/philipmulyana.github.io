name: Blog upkeep (internal links + sitemap)

on:
  schedule:
    - cron: '40 0 * * *'   # 07:40 WIB (00:40 UTC) — before /today (07:45) & story (08:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Airtable step removed 2026-11-19 (Philip): new posts come from Content Factory
      # (render_draft.py), and the daily Airtable re-render overwrote fixes in old posts.
      - name: Internal links (related posts, tool boxes, static blog index)
        run: python .github/scripts/internal_links.py
      - name: Regenerate sitemap from canonical indexable pages
        run: python .github/scripts/generate_sitemap.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add blog/ blog.html tools/ data/posts.json sitemap.xml
            git commit -m "Blog upkeep: internal links + sitemap [skip ci]"
            git push
          else
            echo "no blog changes."
          fi
