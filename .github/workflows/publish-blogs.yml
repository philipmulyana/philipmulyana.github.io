name: Publish blogs (Airtable -> /blog)

on:
  schedule:
    - cron: '40 0 * * *'   # 07:40 WIB (00:40 UTC) — before /today (07:45) & story (08:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown
      - name: Render approved blogs -> /blog + posts.json
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python .github/scripts/publish_blogs.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add blog/ data/posts.json
            git commit -m "Auto-publish blogs from Airtable [skip ci]"
            git push
          else
            echo "no blog changes."
          fi
