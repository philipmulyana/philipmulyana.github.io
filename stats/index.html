<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Traffic — philipmulyana.com</title>
<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#151515; --mute:#6b6b6b; --line:#e7e3da; --accent:#d62828; --bar:#151515; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --card:#1c1c1c; --ink:#f2f2f2; --mute:#9a9a9a; --line:#2c2c2c; --bar:#f2f2f2; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
  .ranges button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 12px; border-radius:999px; cursor:pointer; font:inherit; }
  .ranges button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .kpi .v { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
  .kpi .l { color:var(--mute); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
  h2 { font-size:14px; margin:0 0 12px; color:var(--mute); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .row { display:grid; grid-template-columns:1fr auto; gap:8px; padding:5px 0; font-size:14px; position:relative; }
  .row .n { font-variant-numeric:tabular-nums; font-weight:600; }
  .row .b { grid-column:1/-1; height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
  .row .b i { display:block; height:100%; background:var(--bar); }
  .row .k { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #chart svg { width:100%; height:180px; display:block; }
  .empty { color:var(--mute); font-size:14px; }
  #login { max-width:360px; margin:15vh auto; }
  #login input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; margin:8px 0; }
  #login button { width:100%; padding:10px; border:0; border-radius:8px; background:var(--ink); color:var(--bg); font:inherit; cursor:pointer; }
  .err { color:var(--accent); font-size:13px; }
  .note { color:var(--mute); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <h1>Traffic dashboard</h1>
  <p class="empty">Masukkan token akses.</p>
  <input id="tok" type="password" autocomplete="current-password">
  <button id="go">Masuk</button>
  <p id="lerr" class="err"></p>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <h1>Traffic philipmulyana.com</h1>
    <div class="ranges">
      <button data-d="1">Hari ini</button><button data-d="7" class="on">7 hari</button><button data-d="30">30 hari</button><button data-d="90">90 hari</button>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div class="card" style="margin-bottom:12px"><h2>Pengunjung per hari</h2><div id="chart"></div></div>
  <div class="grid">
    <div class="card"><h2>Sumber traffic</h2><div id="sources"></div></div>
    <div class="card"><h2>Konversi (klik)</h2><div id="clicks"></div></div>
    <div class="card"><h2>Halaman terpopuler</h2><div id="pages"></div></div>
    <div class="card"><h2>Blog terpopuler</h2><div id="blog"></div></div>
    <div class="card"><h2>Tools</h2><div id="tools"></div></div>
    <div class="card"><h2>Kampanye (UTM)</h2><div id="utm"></div></div>
    <div class="card"><h2>Perangkat</h2><div id="devices"></div></div>
  </div>
  <p class="note">Data dari tracker sendiri (tanpa cookie), mulai 11 Nov 2026. Pengunjung = sesi per tab browser.</p>
</div>
<script>
(function () {
  var RPC = 'https://acahbbudqbqinsamyhsc.supabase.co/rest/v1/rpc/pm_stats';
  var KEY = 'sb_publishable_Cy9zSQaPnD3rF3KTMSWWFA_prry7gda';
  var days = 7, token = null;
  try { token = localStorage.getItem('pm_stats_token'); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return (n || 0).toLocaleString('id-ID'); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); };

  function list(el, rows, labels) {
    if (!rows || !rows.length) { $(el).innerHTML = '<p class="empty">Belum ada data.</p>'; return; }
    var max = Math.max.apply(null, rows.map(function (r) { return r.n; }));
    $(el).innerHTML = rows.map(function (r) {
      var k = labels && labels[r.k] ? labels[r.k] : r.k;
      return '<div class="row"><span class="k" title="' + esc(r.k) + '">' + esc(k) + '</span><span class="n">' + fmt(r.n) +
        '</span><span class="b"><i style="width:' + (100 * r.n / max) + '%"></i></span></div>';
    }).join('');
  }
  function chart(rows) {
    if (!rows || !rows.length) { $('chart').innerHTML = '<p class="empty">Belum ada data.</p>'; return; }
    var W = 1000, H = 180, P = 24, max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return r.sessions; })));
    var x = function (i) { return rows.length === 1 ? W / 2 : P + i * (W - 2 * P) / (rows.length - 1); };
    var y = function (v) { return H - P - v * (H - 2 * P) / max; };
    var pts = rows.map(function (r, i) { return x(i) + ',' + y(r.sessions); }).join(' ');
    var dots = rows.map(function (r, i) { return '<circle cx="' + x(i) + '" cy="' + y(r.sessions) + '" r="3" fill="currentColor"><title>' + r.dt + ': ' + r.sessions + ' pengunjung, ' + r.views + ' views</title></circle>'; }).join('');
    $('chart').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="color:var(--ink)">' +
      '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + (H - P) + '" y2="' + (H - P) + '" stroke="var(--line)"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>' + dots +
      '<text x="' + P + '" y="14" font-size="12" fill="var(--mute)">maks ' + max + '</text></svg>';
  }
  var CLICK = { whatsapp: 'Klik WhatsApp', booking: 'Booking konsultasi', webinar: 'Daftar webinar', review_polis: 'Review Polis', tool: 'Buka tools' };

  function load() {
    fetch(RPC, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token, p_days: days }) })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok || !res.j || res.j.error) { try { localStorage.removeItem('pm_stats_token'); } catch (e) {} showLogin('Token salah.'); return; }
      var d = res.j; $('login').hidden = true; $('app').hidden = false;
      var conv = (d.clicks || []).reduce(function (s, r) { return s + r.n; }, 0);
      $('kpis').innerHTML = [['Pengunjung', d.sessions], ['Pageviews', d.views], ['Halaman / pengunjung', d.sessions ? (d.views / d.sessions).toFixed(1) : '0'], ['Klik konversi', conv]]
        .map(function (k) { return '<div class="card kpi"><div class="v">' + (typeof k[1] === 'number' ? fmt(k[1]) : k[1]) + '</div><div class="l">' + k[0] + '</div></div>'; }).join('');
      chart(d.daily); list('sources', d.sources); list('clicks', d.clicks, CLICK); list('pages', d.pages);
      list('blog', d.blog); list('tools', d.tools); list('utm', d.utm); list('devices', d.devices);
    }).catch(function () { showLogin('Gagal memuat data.'); });
  }
  function showLogin(msg) { $('app').hidden = true; $('login').hidden = false; $('lerr').textContent = msg || ''; }
  $('go').onclick = function () { token = $('tok').value.trim(); try { localStorage.setItem('pm_stats_token', token); } catch (e) {} load(); };
  $('tok').onkeydown = function (e) { if (e.key === 'Enter') $('go').click(); };
  document.querySelectorAll('.ranges button').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('.ranges button').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); days = +b.dataset.d; load(); };
  });
  var h = new URLSearchParams(location.hash.slice(1)).get('t');
  if (h) { token = h; try { localStorage.setItem('pm_stats_token', h); } catch (e) {} history.replaceState(null, '', location.pathname); }
  if (token) load(); else showLogin();
})();
</script>
</body>
</html>
