                .replace(/[\u0000-\u001F\u007F-\u009F]/g, '')
                .trim()
                .slice(0, 100);

        function newLeadId() {
            try {
                if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                    return window.crypto.randomUUID();
                }
            } catch (e) {}
            try {
                if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
                    var b = new Uint8Array(16);
                    window.crypto.getRandomValues(b);
                    b[6] = (b[6] & 0x0f) | 0x40;
                    b[8] = (b[8] & 0x3f) | 0x80;
                    var h = [];
                    for (var i = 0; i < 16; i++) h.push((b[i] + 0x100).toString(16).slice(1));
                    return h.slice(0, 4).join('') + '-' + h.slice(4, 6).join('') + '-' +
                           h.slice(6, 8).join('') + '-' + h.slice(8, 10).join('') + '-' +
                           h.slice(10, 16).join('');
                }
            } catch (e) {}
            return '';
        }

        // The one and only read of window.location.search on this page.
        // The raw query string, the referrer, and fbclid are never retained.
        var attribution = {};
        try {
            var params = new URLSearchParams(window.location.search);
            for (var i = 0; i < ATTR_KEYS.length; i++) {

                var clean = sanitizeParam(params.get(key));

            params = null;

        // Short-lived page bootstrap. The form script copies these values

        window.__CEK_AWAL_BOOTSTRAP__ = {
            attribution: attribution,
            lead_id: newLeadId(),
            first_touch: new Date().toISOString()

        // entry; pathname and hash are preserved verbatim.
        var queryFree = false;
        try {

                window.history &&
                typeof window.history.replaceState === 'function') {
                window.history.replaceState(null, '', window.location.pathname + window.location.hash);
            }
            queryFree = !window.location.search;
        } catch (e) {
            queryFree = false;
        }

        // Guarded parser-time loader: document.write keeps /js/pixel.js
        // synchronous and ahead of the form script, so the fbq stub exists
        // before the first custom event is dispatched.
        //
        // This page-scoped flag tells the shared pixel.js to turn off Meta's

        // clicks and their visible label text — i.e. quiz answers — without

        // load and has no effect on any other page, which never sets it.
        if (queryFree) {

    }

    function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
    }

    function focusHeading(h) {
        try {
            h.focus({ preventScroll: true });
        } catch (e) {
            h.focus();
        }
    }

    /* ---- Persistent chrome ---- */

    function renderChrome() {
        var h1 = document.createElement('h1');
        h1.textContent = COPY.first_view.headline;

        var opening = document.createElement('p');
        opening.className = 'opening-line';
        opening.textContent = COPY.first_view.opening_line;

        var micro = document.createElement('p');
        micro.className = 'microcopy';
        micro.textContent = COPY.first_view.microcopy;

        elContext.appendChild(h1);
        elContext.appendChild(opening);
        elContext.appendChild(micro);

        renderWithPolicyLink(elNote, COPY.privacy.note);
        renderWithPolicyLink(elFooter, COPY.footer);
    }

    /* ---- Question rendering ---- */

    function optionNodes() {
        var group = elQblock.querySelector('[role="radiogroup"]');
        if (!group) return [];
        return Array.prototype.slice.call(group.querySelectorAll('.opt'));
    }

    function showError() {
        var err = elQblock.querySelector('.err');
        if (err) err.hidden = false;
    }

    function hideError() {
        var err = elQblock.querySelector('.err');
        if (err) err.hidden = true;
    }

    function renderQuestion(index, moveFocus, announce) {
        var q = COPY.form.questions[index];

        elProgressRegion.hidden = false;
        elCaption.textContent = progressLabel(index + 1);
        elTrack.setAttribute('aria-valuenow', String(index + 1));
        elTrack.setAttribute('aria-valuetext', progressLabel(index + 1));
        elFill.style.width = ((index + 1) * 20) + '%';

        clear(elQblock);

        var headingId = 'q-text-' + q.id;

        var h2 = document.createElement('h2');
        h2.className = 'q-text';
        h2.id = headingId;
        h2.setAttribute('tabindex', '-1');
        h2.textContent = q.text;
        elQblock.appendChild(h2);

        var group = document.createElement('div');
        group.className = 'options';
        group.setAttribute('role', 'radiogroup');
        group.setAttribute('aria-labelledby', headingId);

        var checked = answers[index];
        for (var i = 0; i < q.options.length; i++) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt';
            btn.setAttribute('role', 'radio');
            btn.setAttribute('data-index', String(i));
            btn.setAttribute('aria-checked', checked === i ? 'true' : 'false');
            // Roving tabindex: exactly one option is tabbable — the checked
            // one, otherwise the first.
            btn.setAttribute('tabindex', (checked === i || (checked === null && i === 0)) ? '0' : '-1');
            btn.textContent = q.options[i];
            group.appendChild(btn);
        }

        group.addEventListener('click', onGroupClick);
        group.addEventListener('keydown', onGroupKeydown);
        elQblock.appendChild(group);

        var err = document.createElement('p');
        err.className = 'err';
        err.setAttribute('role', 'alert');
        err.hidden = true;
        err.textContent = COPY.form.validation_message;
        elQblock.appendChild(err);

        // Back control on Q2–Q5 only.
        if (index > 0) {
            var back = document.createElement('button');
            back.type = 'button';
            back.className = 'back';
            back.textContent = COPY.form.back_button;
            back.addEventListener('click', onBack);
            elQblock.appendChild(back);
        }

        if (announce) elLive.textContent = progressLabel(index + 1);
        if (moveFocus) focusHeading(h2);
    }

    /* ---- Interaction ---- */

    function onGroupClick(e) {
        var btn = e.target.closest ? e.target.closest('.opt') : null;
        if (!btn || !elQblock.contains(btn)) return;
        select(parseInt(btn.getAttribute('data-index'), 10));
    }

    function focusOption(opts, i) {
        for (var n = 0; n < opts.length; n++) {
            opts[n].setAttribute('tabindex', n === i ? '0' : '-1');
        }
        opts[i].focus();
    }

    // Deliberate deviation from the WAI-ARIA radio pattern: arrow keys move
    // focus WITHOUT checking. Checking auto-advances this form, so a
    // selection-follows-focus radiogroup would make it impossible for a
    // keyboard user to read past the first option. Selection therefore
    // requires an explicit Enter or Space.
    function onGroupKeydown(e) {
        var opts = optionNodes();
        var i = opts.indexOf(document.activeElement);

        if (i === -1) {
            // Enter on the group itself with nothing chosen — the only path
            // that surfaces the frozen validation message.
            if (e.key === 'Enter' && answers[step] === null) {
                e.preventDefault();
                showError();
            }
            return;
        }

        switch (e.key) {
            case 'ArrowDown':
            case 'ArrowRight':
                e.preventDefault();
                focusOption(opts, (i + 1) % opts.length);
                break;
            case 'ArrowUp':
            case 'ArrowLeft':
                e.preventDefault();
                focusOption(opts, (i - 1 + opts.length) % opts.length);
                break;
            case 'Home':
                e.preventDefault();
                focusOption(opts, 0);
                break;
            case 'End':
                e.preventDefault();
                focusOption(opts, opts.length - 1);
                break;
            case 'Enter':
            case ' ':
            case 'Spacebar':
                // preventDefault stops the page scrolling on Space and stops
                // the button's native click, which would double-activate.
                e.preventDefault();
                select(i);
                break;
            default:
                break;
        }
    }

    function select(index) {
        if (busy) return;                       // double-activation guard
        if (isNaN(index)) return;
        busy = true;

        answers[step] = index;

        var opts = optionNodes();
        for (var i = 0; i < opts.length; i++) {
            opts[i].setAttribute('aria-checked', i === index ? 'true' : 'false');
            opts[i].setAttribute('tabindex', i === index ? '0' : '-1');
        }
        hideError();

        if (!firedStart) {
            firedStart = true;
            track('CekAwalStart');
        }

        window.setTimeout(advance, DWELL_MS);
    }

    function fadeSwap(fn) {
        var out = prefersReducedMotion() ? 0 : FADE_OUT_MS;
        if (out === 0) {
            fn();
            elQblock.classList.remove('is-out');
            busy = false;
            return;
        }
        elQblock.classList.add('is-out');
        window.setTimeout(function () {
            fn();
            elQblock.classList.remove('is-out');
            busy = false;
        }, out);
    }

    function removeContext() {
        if (contextRemoved) return;
        contextRemoved = true;
        if (elContext && elContext.parentNode) {
            elContext.parentNode.removeChild(elContext);
        }
    }

    function advance() {
        // The context block is removed from the DOM on the first advance and
        // never returns, including on Kembali back to Q1.
        removeContext();

        if (step < TOTAL - 1) {
            fadeSwap(function () {
                step += 1;
                renderQuestion(step, true, true);
            });
            return;
        }

        // Q5 branches at the same moment a next question would have rendered.
        var label = COPY.form.questions[4].options[answers[4]];
        route = (label === OPEN_LABEL) ? 'open' : 'closed';

        if (!firedComplete) {
            firedComplete = true;
            track('CekAwalComplete', { route: route });
        }

        fadeSwap(renderResult);
    }

    function onBack() {
        if (busy) return;
        if (step <= 0) return;
        busy = true;
        fadeSwap(function () {
            step -= 1;
            renderQuestion(step, true, true);
        });
    }

    /* ---- Result states ---- */

    function renderResult() {
        elProgressRegion.hidden = true;
        clear(elQblock);
        if (route === 'open') {
            renderOpenRoute();
        } else {
            renderClosedRoute();
        }
    }

    function scrollMainIntoView() {
        try {
            var top = elMain.getBoundingClientRect().top;
            if (top < 0) {
                window.scrollTo({ top: window.pageYOffset + top, behavior: 'auto' });
            }
        } catch (e) {}
    }

    function renderClosedRoute() {
        var h2 = document.createElement('h2');
        h2.className = 'result-heading';
        h2.setAttribute('tabindex', '-1');
        h2.textContent = COPY.closed_route.heading;

        var body = document.createElement('p');
        body.className = 'result-body';
        body.textContent = COPY.closed_route.body;

        elQblock.appendChild(h2);
        elQblock.appendChild(body);

        elLive.textContent = '';
        focusHeading(h2);
        // No Calendly asset, link, contact request, or alternative CTA here.
    }

    function renderOpenRoute() {
        var h2 = document.createElement('h2');
        h2.className = 'result-heading';
        h2.setAttribute('tabindex', '-1');
        h2.textContent = COPY.open_route.heading;

        var body = document.createElement('p');
        body.className = 'result-body';
        body.textContent = COPY.open_route.body;

        // Plain same-tab anchor. No target=_blank, no widget, no iframe, and
        // no Calendly asset is ever loaded into this page.
        var cta = document.createElement('a');
        cta.className = 'cal-cta';
        cta.setAttribute('href', buildCalendlyHref());
        cta.textContent = COPY.open_route.cta_label;
        cta.addEventListener('click', onCalendlyClick);

        var privacyLine = document.createElement('p');
        privacyLine.className = 'cal-privacy';
        privacyLine.textContent = COPY.open_route.calendly_privacy_line;

        elQblock.appendChild(h2);
        elQblock.appendChild(body);
        elQblock.appendChild(cta);
        elQblock.appendChild(privacyLine);

        elLive.textContent = '';
        focusHeading(h2);
        scrollMainIntoView();
    }

    /* ---- Calendly CTA (open route only) ---- */

    // Builds the CTA href from the exact approved event URL plus only the
    // allowlisted attribution already sanitized at parser time and held in
    // memory. Each present, non-empty value is appended exactly once, in
    // ATTR_KEYS order, percent-encoded by URLSearchParams. With no approved
    // values the result is CAL_URL verbatim, with no "?". Nothing else from
    // this page travels to Calendly: not the raw query, fbclid or gclid, the
    // referrer, question or answer text, lead_id, or any identity value.
    //
    // Scope note: this only controls what is safely attached to the outbound
    // URL. Whether Calendly retains these four custom IDs against a booking
    // is not established by the approved research and is not claimed here.
    function buildCalendlyHref() {
        try {
            var url = new URL(CAL_URL);
            var qs = new URLSearchParams();
            for (var i = 0; i < ATTR_KEYS.length; i++) {
                var key = ATTR_KEYS[i];
                if (!Object.prototype.hasOwnProperty.call(ATTRIBUTION, key)) continue;
                var value = ATTRIBUTION[key];
                if (typeof value !== 'string' || !value) continue;
                qs.set(key, value);
            }
            var query = qs.toString();
            url.search = query ? query : '';
            return url.toString();
        } catch (e) {
            return CAL_URL;
        }
    }

    // Bound to the CTA anchor only, so every call is a genuine activation of
    // that control — pointer, Enter, or assistive tech all route through the
    // anchor's click event. Fires at most once, synchronously, before the
    // browser performs the same-tab navigation. The default action is never
    // prevented and the href is not rewritten at click time.
    function onCalendlyClick() {
        if (firedCalendlyClick) return;
        firedCalendlyClick = true;
        track('CalendlyClick');
    }

    /* ---- Init ---- */

    renderChrome();
    renderQuestion(0, false, false);
    track('CekAwalView');
})();
</script>

</body>
</html>
